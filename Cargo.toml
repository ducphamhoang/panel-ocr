[workspace]
resolver = "2"
# NOTE: glob members only match directories that exist. At F0 only `pc-core` exists;
# `xtask` was added to this list by task F1, when the directory was created.
#
# §16.13 item 2: `xtask` is a WORKSPACE MEMBER, not an excluded sub-workspace. It has to
# link `pc-denoise`/`pc-detect`/`pc-testkit` to measure them (task F2), so sharing one
# `Cargo.lock` and one `target/` is the only way `cargo xtask calibrate-goldens` measures
# the same code `cargo test` runs. `publish = false` keeps it off crates.io, and nothing
# in `pc-cli`'s dependency graph reaches it, so being a member costs users nothing.
members = ["crates/*", "xtask"]

[workspace.package]
version      = "1.5.0"
edition      = "2021"
license      = "GPL-3.0-only"
repository   = "https://github.com/ducphamhoang/panel-ocr"
rust-version = "1.94.1"
authors      = ["panel-ocr contributors"]

[workspace.lints.rust]
# §16.52 item 6: `pc-ort`'s new MXCSR guard is the workspace's first `unsafe` (grepped,
# zero prior hits). Enforced rather than conventional: any crate that opts in via
# `[lints] workspace = true` gets a hard denial, with `#[allow(unsafe_code)]` required at
# the one site that actually needs it -- not a repo-wide ban, since only crates that opt
# in are covered, but a real boundary on the ones that do.
unsafe_code = "deny"

[workspace.dependencies]
# --- serialization ---
serde      = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
toml_edit  = { version = "0.22.22", features = ["serde"] }

# --- imaging ---
# jp2 (§12.3) is intentionally absent: the `image` crate has no JPEG2000 codec.
# Per §12.3 note 6 that suffix is rejected at config-validation time.
image = { version = "0.25.5", default-features = false, features = [
    "png", "jpeg", "webp", "tiff", "bmp", "pnm",
] }
imageproc = "0.25.0"
ndarray   = "0.16.1"

# --- concurrency ---
rayon = "1.10.0"

# --- cli / diagnostics ---
clap               = { version = "4.5.21", features = ["derive"] }
thiserror          = "2.0.3"
anyhow             = "1.0.93"          # binary crates only (pc-cli, xtask)
tracing            = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
indicatif          = "0.17.9"

# --- ml (feature-gated; pinned exact per decisions doc #2) ---
# "std" is required here (not just "ndarray"): ort's own "ndarray" feature only
# pulls in the ndarray crate, it does not enable `ndarray/std` -- and ndarray 0.17
# gates `NdFloat` behind that feature. ort's "std" feature is what turns it on.
# `download-binaries` and `copy-dylibs` are ort defaults that `default-features = false`
# unintentionally switches off; without them nothing links (ort-sys/build/main.rs's
# `cargo:rustc-cfg=link_error`). `download-binaries` also requires exactly one TLS
# feature; use `tls-rustls` to match the workspace's reqwest rustls stack and avoid
# introducing a native TLS/OpenSSL dependency. No `api-NN` feature is needed: ort-sys/src/version.rs
# computes ORT_API_VERSION as 17 + V18 + ... + V24, so the featureless state resolves
# to API 17, which any ONNX Runtime >= 1.17 serves, including the prebuilt archive
# fetched by `download-binaries`. Restricted/offline builders can suppress the build-time
# download with ORT_SKIP_DOWNLOAD=1, ORT_OFFLINE=1, or CARGO_NET_OFFLINE=1 (ort-sys/build/vars.rs:9).
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "ndarray", "std", "download-binaries", "copy-dylibs", "tls-rustls",
] }

# --- model acquisition ---
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "blocking", "stream"] }
sha2    = "0.10.8"
hf-hub  = { version = "0.3.2", default-features = false, features = ["ureq"] }

# --- misc ---
regex = "1.11.1"
csv   = "1.3.1"
uuid  = { version = "1.11.0", features = ["v4", "serde"] }   # §4.2 CachePaths

# --- dev only ---
approx   = "0.5.1"
tempfile = "3.14.0"
yaml-rust2 = "0.11.0"

[profile.dev]
# Full debuginfo is why individual test-binary PDBs reach 100+ MiB (measured
# 2026-08-16: some single PDBs over 124 MiB), and `target/` was measured at 35.75 GiB,
# growing ~17 GiB/day on this machine -- on track to repeat the 2026-08-11 129 GiB
# disk-exhaustion incident within about a week. Line-tables-only keeps `file:line` in
# panic backtraces (the thing this project's tests actually rely on) while dropping the
# variable/type debuginfo backtraces don't use. Applies to [profile.test] too, since it
# doesn't override `debug` itself.
debug = "line-tables-only"

[profile.test]
opt-level = 1        # the pixel-math tests are slow at opt-level 0

[profile.bench]
lto = "thin"

[profile.release]
strip = true         # smaller shipped binary; no effect on test/dev profiles
lto = "thin"         # matches [profile.bench]; verify against the test gate before shipping
