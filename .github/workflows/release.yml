name: Release

# Triggered by a version tag (e.g. `v0.1.0`), not by every push — CI's `ci.yml` already
# covers ordinary pushes/PRs. Building `refs/tags/v*` keeps `${{ github.ref_name }}` usable
# directly as both the archive-name version and the GitHub Release tag.
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.feature-set }})
    runs-on: ${{ matrix.os }}
    # Only the Windows+onnx leg is allowed to fail: §16.33 item 10 already ratified that the
    # onnx tier's Windows linking behaviour is unverified. Every other leg is a real release
    # blocker — a Linux/macOS build failure, or a Windows DEFAULT-tier failure, must fail this
    # workflow, not be silently swallowed the way §16.33 previously warned against doing at
    # the job level for `ci.yml`'s `test-onnx` job.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature-set: default
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            feature-set: onnx
          - os: macos-latest
            target: x86_64-apple-darwin
            feature-set: default
          # No x86_64-apple-darwin + onnx leg: confirmed on 2026-08-04 (run 30908406221) that
          # `ort` does not ship a prebuilt ONNX Runtime binary for this target at all — only
          # aarch64-apple-darwin (Apple Silicon) — so this combination cannot build, ever,
          # without vendoring a custom ONNX Runtime build. Not "unverified"; confirmed
          # unsupported. Omitted rather than marked allow-failure, since allow-failure implies
          # "might work" and this doesn't.
          - os: macos-latest
            target: aarch64-apple-darwin
            feature-set: default
          - os: macos-latest
            target: aarch64-apple-darwin
            feature-set: onnx
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            feature-set: default
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            feature-set: onnx
            allow-failure: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.feature-set }}
          # ort-sys caches the downloaded native ONNX Runtime here; irrelevant but harmless
          # for the `default` feature-set legs.
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io

      - name: Build (default feature set)
        if: matrix.feature-set == 'default'
        run: cargo build --release --locked --target ${{ matrix.target }} -p pc-cli

      - name: Build (onnx feature set)
        if: matrix.feature-set == 'onnx'
        run: cargo build --release --locked --target ${{ matrix.target }} -p pc-cli --features pc-cli/onnx

      - name: Stage archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="panel-ocr-${{ github.ref_name }}-${{ matrix.target }}-${{ matrix.feature-set }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/panel-ocr" "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          echo "ASSET_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Stage archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "panel-ocr-${{ github.ref_name }}-${{ matrix.target }}-${{ matrix.feature-set }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/panel-ocr.exe" "$stage/"
          Copy-Item README.md, LICENSE "$stage/"
          Copy-Item scripts/windows/setup.bat "$stage/"
          echo "STAGE_DIR=$stage" >> $env:GITHUB_ENV

      - name: Smoke-test setup.bat (Windows, default leg only)
        # Only the default leg, not onnx: this checks setup.bat's own file-writing logic
        # (the only part that can't be exercised anywhere but a real cmd.exe), not the
        # `models download` command it shells out to, which is exercised elsewhere. Feeds
        # two scripted answers — blank line (accept the default cache dir) and "n" (skip
        # the real ~90MB download) — since there's no config.toml yet on a fresh runner,
        # matching the two-prompt path exactly.
        if: runner.os == 'Windows' && matrix.feature-set == 'default'
        shell: cmd
        run: |
          cd "%STAGE_DIR%"
          (echo.& echo n) | setup.bat
          if not exist "%APPDATA%\panel-ocr\config.toml" (
            echo setup.bat did not write config.toml
            exit /b 1
          )
          type "%APPDATA%\panel-ocr\config.toml"
          findstr /c:"cache_dir = '" "%APPDATA%\panel-ocr\config.toml" >nul
          if errorlevel 1 (
            echo config.toml was written but has no cache_dir line
            exit /b 1
          )

      - name: Compress archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path $env:STAGE_DIR -DestinationPath "$($env:STAGE_DIR).zip"
          echo "ASSET_PATH=$($env:STAGE_DIR).zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        # An allowed-to-fail Windows+onnx leg that DID fail has no archive to upload; skip
        # rather than error the upload step itself, since the build failure already carries
        # the signal (and, per the job's `continue-on-error`, does not fail this workflow).
        if: always() && env.ASSET_PATH != ''
        with:
          name: panel-ocr-${{ matrix.target }}-${{ matrix.feature-set }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged assets
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          # The Windows+onnx leg is allowed to fail (see the build job); if it did, its
          # archive is simply absent from `dist/` and every other platform's asset still
          # publishes. Nothing here masks that absence — check the workflow run itself for
          # which legs actually produced an artifact.
