name: CI

on:
  push:
    branches: [main]
  pull_request:

# Per ARCHITECTURE_DECISIONS.md: Linux + macOS only. Windows is a v2 concern (§16).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy never links, so skipping the ~100+ MB fetch is free; ort-sys's
      # link_error cfg is harmless for this check-only pass.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          ORT_SKIP_DOWNLOAD: "1"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # CI never runs ML models (§7.2): no ONNX weights are downloaded here.
      # Detector-dependent tests use recorded fixtures + ReplayDetector.
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: doc tests
        run: cargo test --workspace --doc

  test-onnx:
    name: test (onnx, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          # ort-sys stores downloaded native runtimes in the platform cache directory.
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
      # The onnx feature's tests were previously type-checked by all-features clippy but
      # never executed. §7.2 line 551 forbids running models; this tier honours that because
      # its tests are model-free, while the only weights-dependent smoke test self-skips
      # unless PANEL_OCR_ONNX_MODEL and a loadable ONNX Runtime are both present.
      - name: cargo test (onnx feature)
        run: cargo test --workspace --all-targets --features pc-cli/onnx

  frozen-snapshot-guard:
    name: frozen snapshot guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # §16.20 item 1: snapshots are prohibited project-wide, so this guard is
      # exact rather than approximate. It rejects all snapshot file forms.
      - name: reject snapshots
        run: |
          if find . \
            \( -type d \( -name .git -o -name target -o -name vendor -o -name node_modules \) -prune \) \
            -o \( -type f \( -name '*.snap' -o -name '*.snap.new' -o -name '*.pending-snap' \) -print -quit \) | grep -q .; then
            echo "::error::snapshot files are prohibited project-wide (§16.20 item 1)"
            exit 1
          fi
