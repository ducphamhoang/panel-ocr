name: CI

on:
  push:
    branches: [main]
  pull_request:

# Per ARCHITECTURE_DECISIONS.md: Linux + macOS only. Windows is a v2 concern (§16).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # §15.10(b): snapshot files are frozen tests. CI must never accept or write a
  # snapshot; a drifted snapshot is a FAILURE requiring joint-architect sign-off,
  # never a `cargo insta accept`.
  INSTA_UPDATE: "no"
  INSTA_FORCE_UPDATE: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # CI never runs ML models (§7.2): no ONNX weights are downloaded here.
      # Detector-dependent tests use recorded fixtures + ReplayDetector.
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: doc tests
        run: cargo test --workspace --doc

  frozen-snapshot-guard:
    name: frozen snapshot guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # §15.10(c): only the two sanctioned snapshot sites may exist. Any additional
      # `.snap` file, or any pending `.snap.new`, fails the build.
      - name: reject pending snapshots
        run: |
          if find . -name '*.snap.new' -print -quit | grep -q .; then
            echo "::error::pending .snap.new files present; snapshots are frozen tests (§15.10)"
            exit 1
          fi
      - name: enforce snapshot site allowlist
        run: |
          count=$(find . -name '*.snap' | wc -l | tr -d ' ')
          if [ "$count" -gt 2 ]; then
            echo "::error::$count snapshot files found; §15.10 permits exactly 2 (§8.7(B)9, §9.7(B)11)"
            find . -name '*.snap'
            exit 1
          fi
