[package]
name        = "pc-pipeline"
description = "panel-ocr orchestrator (spec §4, §5): cache paths, checkpoints, five-stage chaining, batch isolation."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
pc-core       = { path = "../pc-core" }
pc-config     = { path = "../pc-config" }
pc-imageops   = { path = "../pc-imageops" }
# The orchestrator is the ONE crate allowed to depend on every stage (§1's graph);
# §1 rule 2 only forbids stage-to-stage edges.
pc-detect     = { path = "../pc-detect" }
pc-preprocess = { path = "../pc-preprocess" }
pc-ocr        = { path = "../pc-ocr" }
pc-mask       = { path = "../pc-mask" }
pc-denoise    = { path = "../pc-denoise" }
pc-export     = { path = "../pc-export" }
pc-inpaint    = { path = "../pc-inpaint" }

image      = { workspace = true }
# §4.5: per-image parallelism, in the pipeline's own thread pool (§16.12 item 17).
rayon      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# §4.2: CachePaths' clobber-protection uuid.
uuid       = { workspace = true }

[dev-dependencies]
pc-testkit = { path = "../pc-testkit" }
tempfile   = { workspace = true }
# Feature-enabled re-declarations so the integration tests see the testkit-gated mocks
# (the same self/peer dev-dependency trick `pc-detect` and `pc-preprocess` use).
pc-detect  = { path = "../pc-detect", features = ["testkit"] }
pc-ocr     = { path = "../pc-ocr", features = ["testkit"] }
# Task L4, TEST-ONLY. `tests/l4_composite_equivalence.rs` has to name `pc_mask::combine`,
# `pc_denoise::composite` AND `pc_inpaint::compose` in one compilation unit, and §1 rule 2
# forbids a stage-to-stage edge even through `[dev-dependencies]` (that would put the
# forbidden edge in the workspace graph). `pc-pipeline` is the ONE crate allowed to depend on
# every stage, so hosting the test here adds no new edge -- the same placement task L1 used
# for `l1_morph_equivalence.rs`. This is NOT L6's wiring: nothing under `src/` references
# `pc-inpaint`, and `Step::Inpaint` does not exist yet.
pc-inpaint = { path = "../pc-inpaint" }
