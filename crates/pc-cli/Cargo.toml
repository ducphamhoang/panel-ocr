[package]
name        = "pc-cli"
description = "panel-ocr's command-line front end (spec §13.1): clap surface, config discovery, logging, exit codes."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "panel-ocr"
path = "src/main.rs"

[lib]
name = "pc_cli"
path = "src/lib.rs"

[features]
default = []
# Keep the whole pipeline runnable with mocks and replay fixtures without model files or
# ONNX Runtime; the real backend is opt-in because the spec requires this no-onnx default.
onnx = ["pc-detect/onnx", "pc-ocr/onnx"]

[dependencies]
pc-core     = { path = "../pc-core" }
pc-config   = { path = "../pc-config" }
pc-pipeline = { path = "../pc-pipeline" }
pc-export   = { path = "../pc-export" }
pc-ocr      = { path = "../pc-ocr" }
# The ONNX feature is non-default so the whole pipeline remains runnable on mocks and
# replay fixtures with no model files and no ONNX Runtime, as required by spec §7.2.
pc-detect   = { path = "../pc-detect", features = ["testkit"] }
pc-models   = { path = "../pc-models" }

anyhow             = { workspace = true }
clap               = { workspace = true }
indicatif          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
pc-testkit = { path = "../pc-testkit" }
image      = { workspace = true }
tempfile   = { workspace = true }
