[package]
name        = "pc-export"
description = "panel-ocr STAGE 5: export (spec §12) -- format/quality options, artifact precedence, destination resolution, OCR reports."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
pc-core   = { path = "../pc-core" }
# §16.5 item 1: every stage crate depends on pc-config. Here it is also the single
# source of truth for the supported output-suffix list (§12.7(A)9): `from_suffix`'s
# error message reuses `pc_config::validate::supported_suffix_list()` so the runtime
# message and the config-validation message can never drift.
pc-config = { path = "../pc-config" }
# §16.42: `blend_channel` / `resize_nearest_rgba` / `alpha_composite_over` are hoisted into
# `pc_imageops::composite` and re-exported from `composite.rs`. This edge is the one §1's
# crate dependency graph already lists (`pc-imageops <- pc-detect, pc-mask, pc-denoise,
# pc-export`), so adding it fills in an authorised edge rather than introducing a new one.
# It replaces the former NOTE here (§16.11 item 10) asserting there was no `pc-imageops`
# dependency and that the pixel math was restated locally -- §16.42 supersedes item 10.
pc-imageops = { path = "../pc-imageops" }
image     = { workspace = true }
serde     = { workspace = true }
tracing   = { workspace = true }
# NOTE: no `rayon` -- export is I/O bound and runs inside the pipeline's per-image
# rayon task already (§4.5).

[dev-dependencies]
pc-testkit = { path = "../pc-testkit" }
serde_json = { workspace = true }
tempfile   = { workspace = true }
