[package]
name        = "xtask"
description = "panel-ocr maintainer tooling (spec §7.2 task F1, §7.3 task F2): fixture recording and golden calibration. Never shipped to users."
publish     = false

version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true

[features]
default = []
onnx    = [
    "pc-detect/onnx",
    "pc-detect/bench-tuning",
    # §16.43 item 5 (D3): mode-bench's LaMa cells reuse `pc_cli::inpainter`'s provider, so
    # xtask's own `onnx` tier must turn on the same backend the provider builds against.
    "pc-inpaint/onnx",
    "pc-cli/onnx",
]
cuda    = ["pc-cli/cuda"]

[dependencies]
# §16.13 item 3: xtask is the ONE place `pc-testkit` is a normal (non-dev) dependency.
# It is maintainer tooling, not shipped code, so §1's "pc-testkit is a dev-dependency
# only" rule (which exists to keep test helpers out of the user-facing binary) is
# satisfied in spirit: nothing in `crates/pc-cli`'s dependency graph gains pc-testkit.
pc-testkit = { path = "../crates/pc-testkit" }
pc-core    = { path = "../crates/pc-core" }
pc-config  = { path = "../crates/pc-config" }
pc-denoise = { path = "../crates/pc-denoise" }
pc-detect  = { path = "../crates/pc-detect", features = ["testkit"] }
pc-imageops = { path = "../crates/pc-imageops" }
pc-preprocess = { path = "../crates/pc-preprocess" }
pc-mask    = { path = "../crates/pc-mask" }
pc-models  = { path = "../crates/pc-models" }
pc-ocr     = { path = "../crates/pc-ocr" }
# §16.43 item 5 (D3, Fable's ruling): mode-bench's LaMa cells reuse
# `pc_cli::inpainter::build_provider` rather than hand-rolling a second model-acquisition
# mechanism, and call `pc_pipeline::run_inpaint` directly (item 8's stage sequence).
# `pc-inpaint` additionally removes the local eligibility mirror task 2 had to carry.
pc-inpaint = { path = "../crates/pc-inpaint" }
pc-pipeline = { path = "../crates/pc-pipeline" }
pc-cli     = { path = "../crates/pc-cli" }

anyhow     = { workspace = true }
clap       = { workspace = true }
image      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }

[dev-dependencies]
# Falsifying `provenance_is_current`'s four conditions needs a throwaway workspace tree; the
# alternative is mutating `tests/fixtures/recorded/`, which is the corruption those gates detect.
tempfile = { workspace = true }
# §16.38 item 16(c)'s test double, so mode-bench's LaMa tests exercise a REAL `run_inpaint`
# call in the default no-`onnx` tier — the tier cookbook rule 6 records as the one that
# actually executes. Without it every LaMa assertion here would be `onnx`-gated and skipped.
pc-inpaint = { path = "../crates/pc-inpaint", features = ["testkit"] }

[lints.clippy]
# The frozen G1-D test deliberately mutates one config instance after `default()` so it can prove
# `recorded_session_pins` observes that exact instance rather than a replacement literal.
field-reassign-with-default = "allow"
